<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Заметки — Cotes</title>
    <link rel="icon" href="assets/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/app.js" defer></script>
</head>
<body class="app-body">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 4 4H6l4-4-1-6ZM12 14v6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7l-4-4ZM14 3v4h4M9 13h6M9 17h6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
</svg>

<div class="app" id="app">
    <aside class="sidebar" aria-label="Список заметок">
        <div class="sidebar__head">
            <a href="index.html" class="brand">
                <span class="brand__tile"><img src="assets/images/logo.svg" alt=""></span>
                Cotes
            </a>
            <button class="icon-btn" type="button" data-theme-toggle aria-label="Тема">
                <svg class="icon icon-system"><use href="#i-monitor"/></svg>
                <svg class="icon icon-light"><use href="#i-sun"/></svg>
                <svg class="icon icon-dark"><use href="#i-moon"/></svg>
            </button>
            <button class="icon-btn" type="button" id="new-note" data-shortcut="Alt+N" aria-label="Новая заметка">
                <svg class="icon"><use href="#i-plus"/></svg>
            </button>
        </div>

        <div class="search" id="search-box">
            <svg class="icon"><use href="#i-search"/></svg>
            <input type="search" id="search" placeholder="Поиск" aria-label="Поиск по заметкам" autocomplete="off" spellcheck="false">
            <kbd data-mod>Ctrl K</kbd>
            <button class="icon-btn" type="button" id="search-clear" aria-label="Очистить поиск" hidden>
                <svg class="icon"><use href="#i-x"/></svg>
            </button>
        </div>

        <p class="sidebar__count" id="count" aria-live="polite"></p>
        <ul class="note-list" id="note-list" aria-label="Заметки"></ul>

        <div class="empty" id="empty-none" hidden>
            <h2>Пока пусто</h2>
            <p>Первая заметка сохранится только в этом браузере.</p>
            <button class="btn btn--solid" type="button" data-action="new">Новая заметка</button>
        </div>
        <div class="empty" id="empty-search" hidden>
            <h2>Ничего не нашлось</h2>
            <p id="empty-search-text"></p>
            <button class="btn btn--ghost" type="button" data-action="clear-search">Сбросить поиск</button>
        </div>
        <button class="fab" type="button" data-action="new" aria-label="Новая заметка">
            <svg class="icon"><use href="#i-plus"/></svg>
        </button>
    </aside>

    <main class="pane" aria-label="Редактор">
        <div class="toolbar">
            <button class="icon-btn toolbar__back" type="button" id="back" aria-label="К списку заметок">
                <svg class="icon"><use href="#i-back"/></svg>
            </button>
            <button class="icon-btn toolbar__focus" type="button" id="focus-toggle" aria-pressed="false" data-shortcut="Ctrl+\" aria-label="Скрыть список">
                <svg class="icon"><use href="#i-sidebar"/></svg>
            </button>
            <span class="toolbar__status" id="save-status" role="status"></span>
            <button class="icon-btn" type="button" id="pin" aria-pressed="false" aria-label="Закрепить" data-note-action>
                <svg class="icon"><use href="#i-pin"/></svg>
            </button>
            <button class="icon-btn icon-btn--danger" type="button" id="delete" aria-label="Удалить заметку" data-note-action>
                <svg class="icon"><use href="#i-trash"/></svg>
            </button>
            <div class="menu">
                <button class="icon-btn" type="button" id="menu-button" aria-haspopup="true" aria-expanded="false" aria-controls="menu" aria-label="Ещё">
                    <svg class="icon"><use href="#i-more"/></svg>
                </button>
                <div class="menu__list" id="menu" role="menu" hidden>
                    <button class="menu__item" type="button" role="menuitem" data-action="export-txt" data-note-action>
                        <svg class="icon"><use href="#i-file"/></svg>Скачать заметку (.txt)
                    </button>
                    <div class="menu__sep" role="separator"></div>
                    <button class="menu__item" type="button" role="menuitem" data-action="export-json">
                        <svg class="icon"><use href="#i-download"/></svg>Резервная копия всех (.json)
                    </button>
                    <button class="menu__item" type="button" role="menuitem" data-action="import">
                        <svg class="icon"><use href="#i-upload"/></svg>Восстановить из копии…
                    </button>
                </div>
            </div>
        </div>

        <div class="editor" id="editor" hidden>
            <div class="editor__inner">
                <input class="editor__title" id="title" type="text" placeholder="Заголовок" aria-label="Заголовок заметки" autocomplete="off">
                <textarea class="editor__text" id="text" placeholder="Начните писать…" aria-label="Текст заметки"></textarea>
            </div>
        </div>

        <div class="empty" id="empty-pane">
            <span class="brand__tile"><img src="assets/images/logo.svg" alt=""></span>
            <h2>Выберите заметку</h2>
            <p>или начните новую — сохранять ничего не нужно.</p>
            <button class="btn btn--solid" type="button" data-action="new">Новая заметка</button>
            <dl class="shortcuts">
                <dt><kbd>Alt N</kbd></dt><dd>новая заметка</dd>
                <dt><kbd data-mod>Ctrl K</kbd></dt><dd>поиск</dd>
                <dt><kbd>↑ ↓</kbd></dt><dd>по списку</dd>
                <dt><kbd data-mod>Ctrl \</kbd></dt><dd>скрыть список</dd>
            </dl>
        </div>

        <footer class="statusbar" id="statusbar" hidden>
            <span id="meta-date"></span>
            <span id="meta-count"></span>
        </footer>
    </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button class="btn" type="button" id="toast-action"></button>
</div>
<input type="file" id="import-file" accept=".json,application/json" hidden>
</body>
</html>
