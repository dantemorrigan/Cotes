<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotes</title>
    <link rel="icon" href="assets/images/favicon.png" type="image/png">
    <script>
        // Редактор теперь живёт на странице заметок. Старые ссылки
        // (editor.html и editor.html?index=N) ведут туда же.
        (function () {
            var index = new URLSearchParams(location.search).get('index');
            location.replace('notes-and-edit.html' + (index !== null ? '?index=' + encodeURIComponent(index) : '#new'));
        })();
    </script>
</head>
<body>
    <p><a href="notes-and-edit.html">Открыть заметки</a></p>
</body>
</html>
