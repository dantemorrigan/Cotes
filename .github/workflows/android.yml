name: Android build

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decrypt signing key
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./scripts/decrypt-key.sh
      - name: Check, test and build APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./scripts/check-strings.sh
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Cotes-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cotes-checks-${{ github.run_number }}
          path: |
            android/app/build/reports/lint-results-release.html
            android/app/build/reports/tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Cotes-android-${{ github.run_number }}
          path: android/Cotes-*.apk
          if-no-files-found: error

  # Мини-регресс в эмуляторе Android 14: тесты сценариев + скриншоты обеих тем.
  regress:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decrypt signing key
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./scripts/decrypt-key.sh
      # Эмулятору нужно несколько гигабайт; на раннере лишнее (dotnet, ghc, CodeQL) убираем.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          mkdir -p build/regress
          df -h / | tee build/regress/disk.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and tests
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest
          df -h / | tee -a build/regress/disk.txt
      - name: Run regression on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: android
          script: ./scripts/regress.sh
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cotes-regress-${{ github.run_number }}
          path: android/build/regress
      # Скриншоты и отчёты — в служебную ветку, чтобы их можно было посмотреть без скачивания артефактов.
      - name: Publish screenshots and reports to ci/android-screens
        if: always()
        run: |
          [ -d build/regress ] || exit 0
          cd build/regress
          git init -q -b ci/android-screens
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Android regress ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci/android-screens
